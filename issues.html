<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<script>
// App size (textsize.js) set before the first paint, so every page opens at the chosen size: on a phone the page is
// laid out narrower (screen width / size) and the zoom is locked there, like Ctrl + scroll in a browser.
window.kcgmViewport = function(z){ try {
  var m = document.querySelector('meta[name="viewport"]'); if (!m || !matchMedia("(pointer: coarse)").matches) return;
  if (!(z >= .7 && z <= 2.4) || z === 1){ m.setAttribute("content", "width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content"); return; }
  var land = screen.orientation ? /landscape/.test(screen.orientation.type) : innerWidth > innerHeight, w = land ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
  m.setAttribute("content", "width=" + Math.round(w / z) + ", initial-scale=" + z + ", minimum-scale=" + z + ", maximum-scale=" + z + ", viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content");
} catch (e) {} };
// (a phone with no choice yet opens at 1.6, the app's 100%)
try { var z0 = parseFloat(localStorage.getItem("kcgm_text_size")); kcgmViewport(z0 > 0 ? z0 : 1.6); } catch (e) {}
// Theme (one for every page, Settings → Theme): "dark", "light" or "device" (follows the computer / phone), set before
// the first paint as data-theme on <html>
window.kcgmTheme = function(v){ try { v = v || localStorage.getItem("kcgm_theme") || "device";
  document.documentElement.dataset.theme = v === "dark" || (v !== "light" && !matchMedia("(prefers-color-scheme: light)").matches) ? "dark" : "light"; } catch (e) {} };
kcgmTheme();
// Text size (Settings → Text size): the app's three text sizes (titles, labels, body) scaled together, 65, 75, 90, 100
// or 115 percent; set before the first paint as the size variables on <html>
// On a phone the steps are 55, 65, 75, 85, 100 percent (Normal is the old Small; a step chosen before moves up one)
window.kcgmText = function(v){ try { var ph = matchMedia("(pointer: coarse)").matches;
  if (ph && !localStorage.getItem("kcgm_text_m")) { var o = localStorage.getItem("kcgm_text"); if (o) localStorage.setItem("kcgm_text", { xs: "s", s: "n", n: "l", l: "xl", xl: "xl" }[o] || "n"); localStorage.setItem("kcgm_text_m", "1"); }
  v = v || localStorage.getItem("kcgm_text") || "n"; var k = (ph ? { xs: .55, s: .65, n: .75, l: .85, xl: 1 } : { xs: .65, s: .75, n: .9, l: 1, xl: 1.15 })[v] || (ph ? .75 : .9), s = document.documentElement.style;
  s.setProperty("--fh", 22 * k + "px"); s.setProperty("--fl", (ph ? 35 / 3 : 13) * k + "px"); s.setProperty("--fb", 15 * k + "px"); } catch (e) {} };
kcgmText();
try { addEventListener("storage", function(e){ if (e.key === "kcgm_text") { kcgmText(); dispatchEvent(new Event("resize")); } }); } catch (e) {}
try { matchMedia("(prefers-color-scheme: light)").addEventListener("change", function(){ kcgmTheme(); });
  addEventListener("storage", function(e){ if (e.key === "kcgm_theme") kcgmTheme(); }); } catch (e) {}
// the app's accent theme (View > Theme), also before the first paint, as data-accent on <html>; slate unless picked
window.kcgmAccent = function(v){ try { v = v || localStorage.getItem("kcgm_accent") || "slate"; if (!/^(slate|graphite|navy|petrol|olive|stone|rust|ink)$/.test(v)) v = "slate"; document.documentElement.dataset.accent = v; } catch (e) {} };
kcgmAccent();
try { addEventListener("storage", function(e){ if (e.key === "kcgm_accent") kcgmAccent(); }); } catch (e) {}
</script>
<style id="kcgmThemes">
/* accent themes: main, darker, light tint, button fill. Only things that are "the app" follow them (selected pills,
   sliders, tags, buttons, outlines, progress lines); colours that mean something (fluids, check types, stages, warnings,
   search hits, chart series) never do, and the same eight as ActionMap: deep and muted, so none passes for a fluid, check type or search colour */
:root,html[data-accent="slate"]{--thm:#475569;--thd:#334155;--tht:#eef1f5;--thb:#64748b}
html[data-accent="graphite"]{--thm:#52525b;--thd:#3f3f46;--tht:#f0f0f1;--thb:#71717a}
html[data-accent="navy"]{--thm:#1e3a5f;--thd:#132845;--tht:#e8edf4;--thb:#2d4f7c}
html[data-accent="petrol"]{--thm:#1f4f5a;--thd:#143a43;--tht:#e7f0f1;--thb:#2d6673}
html[data-accent="olive"]{--thm:#5a5a2e;--thd:#444422;--tht:#f0f0e6;--thb:#6e6e3a}
html[data-accent="stone"]{--thm:#7a6a5d;--thd:#5f5147;--tht:#f3efeb;--thb:#8f7f71}
html[data-accent="rust"]{--thm:#9a3412;--thd:#7c2a0e;--tht:#f8ece6;--thb:#b4471f}
html[data-accent="ink"]{--thm:#111827;--thd:#000000;--tht:#e9ebef;--thb:#1f2937}
:root{--rh:#eef0f3;--rs:#e1e4e8;--rsb:#8b939d;--th:var(--thm);--th2:var(--thd);--th-t:var(--tht);--th-b:var(--thb);--on-th:#fff}
html[data-theme="dark"]{--rh:#262b32;--rs:#333941;--rsb:#7a828c;--th:color-mix(in srgb,var(--thm) 62%,#fff);--th2:color-mix(in srgb,var(--thm) 78%,#fff);--th-t:color-mix(in srgb,var(--thm) 32%,#15191e);--th-b:color-mix(in srgb,var(--thb) 80%,#fff)}   /* lifted so it reads on black */
</style>

<style>

  --s-decision:#1d4ed8;--s-clash:#b91c1c;--s-missing:#a16207;--s-placeholder:#6d28d9;--s-check:#6b7280;--s-diagram:#047857}
@media (min-width:901px) and (hover:hover){.page{margin-left:24px !important;margin-right:auto !important}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff)}
code,kbd,pre,button,input,select,textarea{font-family:var(--ff)}
.page{max-width:1500px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
h1{font-size:var(--fh,22px);margin:0;flex:1;min-width:180px}
h1 span{color:var(--gold)}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-weight:700;font-size:var(--fb,15px);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--card);color:color-mix(in srgb,var(--gold) 70%,var(--ink));border-color:var(--gold)}
.btn.upd-new{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.sub{color:var(--mute);font-size:var(--fb,15px);line-height:1.45;margin:4px 0 12px}
.ver{font-size:var(--fb,15px);color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:var(--fb,15px);font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:center}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.off{opacity:.4}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 12px}
.bar input,.bar select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;font-size:var(--fb,15px)}
.bar input{flex:1;min-width:200px}
.count{font-size:var(--fb,15px);color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:var(--fb,15px);background:var(--card);border-radius:12px;overflow:hidden}
td.date{white-space:nowrap;font-variant-numeric:tabular-nums}.newer{font-weight:800;color:var(--gold)}.newer::after{content:" (newer)";font-weight:600;color:var(--mute)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:10px 0 12px}
.tab{appearance:none;border:0;background:none;color:var(--mute);font:inherit;font-weight:800;font-size:var(--fb,15px);padding:9px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tab span{font-weight:600;font-size:var(--fb,15px);color:var(--mute)}
[hidden]{display:none!important}
td.num{font-family:inherit;font-weight:700;font-size:var(--fb,15px);white-space:nowrap}
.kind{font-size:var(--fb,15px);font-weight:800;padding:2px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.hist{margin-top:4px}.hist summary{cursor:pointer;color:var(--gold);font-size:var(--fb,15px);font-weight:700}
.hist table{font-size:var(--fb,15px);margin-top:4px;background:var(--card2)}.hist td{padding:4px 6px}
.dnote{color:var(--mute);font-size:var(--fb,15px);margin-top:4px}
.tb-btns{display:flex;flex-wrap:nowrap;gap:6px}.tb-btns .btn{font-size:var(--fb,15px);padding:5px 10px;white-space:nowrap}
#docRows td{vertical-align:middle;padding-top:7px;padding-bottom:7px}#docRows td.num{white-space:nowrap}
#docRows .ib{border:1px solid var(--line);background:none;color:var(--mute);border-radius:50%;width:20px;height:20px;padding:0;font-size:var(--fb,15px);line-height:1;cursor:pointer;vertical-align:1px;margin-left:4px}
#docRows .ib.on,#docRows .ib:hover{border-color:var(--gold);color:var(--gold)}
#docRows tr.dinfo td{background:var(--card2);padding:10px 14px}
#docRows table.hist{width:auto;background:none;font-size:var(--fb,15px);margin:0}#docRows table.hist td{padding:2px 16px 2px 0;border:0;background:none}
.dkv{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 18px;font-size:var(--fb,15px)}
.dkv span{display:block;font-size:var(--fl,13px);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.dh{font-size:var(--fl,13px);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:10px 0 2px}
.sv{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.sv-top{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.sv-t{flex:1;min-width:0}.sv-t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sv-t small{color:var(--mute);font-size:var(--fb,15px);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px}
.sv-bar select,.sv-bar input{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;font-size:var(--fb,15px);max-width:100%}
.sv-bar input{flex:1;min-width:180px}
.sv-wrap{flex:1;overflow:auto;padding:0 14px 14px}
table.sv-tb{width:auto;border-collapse:separate;border-spacing:0;font-size:var(--fb,15px);border-radius:0;overflow:visible}
.sv-tb th{position:sticky;top:0;z-index:2;text-align:center;letter-spacing:0;padding:4px 8px;border-right:1px solid var(--line)}
.sv-tb td{display:table-cell;padding:3px 8px;border-top:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;max-width:24em;overflow:hidden;text-overflow:ellipsis;line-height:1.35;cursor:pointer}
.sv-tb td.open{white-space:pre-wrap;max-width:36em;overflow:visible}
.sv-tb td.n{text-align:right;font-variant-numeric:tabular-nums}
.sv-tb .rn{position:sticky;left:0;z-index:1;background:var(--card2);color:var(--mute);text-align:right;font-size:var(--fb,15px);cursor:default}
.sv-tb th.rn{z-index:3}
.sv-tb tr.hd td{position:sticky;top:26px;z-index:1;background:var(--card2);font-weight:800;white-space:normal;vertical-align:bottom;min-width:5em}
.sv-tb tr.hd td.rn{z-index:3}
.sv-tb tr.pre td{color:var(--mute)}
th{text-align:left;font-size:var(--fl,13px);letter-spacing:.6px;text-transform:uppercase;color:var(--mute);background:var(--card2);padding:9px 8px;position:sticky;top:0}
td{padding:8px;border-top:1px solid var(--line);vertical-align:top;line-height:1.4}
td.doc{color:var(--mute);font-size:var(--fb,15px)}
td.item{font-family:inherit;font-weight:700;font-size:var(--fb,15px);min-width:9em;overflow-wrap:anywhere;word-break:normal}
.sev{font-size:var(--fb,15px);font-weight:800;padding:2px 8px;border-radius:99px;color:#fff;white-space:nowrap}
.note{font-size:var(--fb,15px)}
.more{text-align:center;margin:12px}
/* ---------- phone: the bottom tab bar (More), the filter in the top row; Checks: tiles that filter, then short cards
   (tap one for the documents, dates and comment); Sources: one row per document, tap it for the details ---------- */
#about{display:none}
:root.phone body{padding-top:var(--tb);padding-bottom:var(--bn)}
/* desktop: the app's tab strip on top (Sources and Checks are its last two tabs), so no header or tabs of its own */
:root.has-tb:not(.phone) body{padding-top:var(--tb)}:root.has-tb:not(.phone) .page>header,:root.has-tb:not(.phone) .tabs,:root.has-tb:not(.phone) #ver{display:none}
:root.phone .page>header,:root.phone #ver,:root.phone .tabs,:root.phone #checksPane>p.sub{display:none}
:root.phone #checksPane.about>p.sub{display:block}
:root.phone #about{display:inline-block;border:0;background:none;color:var(--gold);font:inherit;font-size:var(--fb,15px);font-weight:700;padding:4px 0;margin:0 0 6px;cursor:pointer}
:root.phone #sevChips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
:root.phone #sevChips .chip{flex-direction:column;align-items:flex-start;gap:0;border-radius:12px;padding:8px 10px;font-weight:600;color:var(--mute);min-width:0;font-size:var(--fl,13px);overflow-wrap:anywhere}
:root.phone #sevChips .chip i{display:none}:root.phone #sevChips .chip span{order:-1;font-size:var(--fh,22px);font-weight:800;color:var(--c)}
:root.phone #sevChips .chip.off{opacity:.45}:root.phone #sevChips .chip.solo{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
:root.phone .bar #q{display:none}
:root.phone #rows tr{cursor:pointer;padding:10px 12px}
:root.phone #rows td{padding:2px 0}
:root.phone #rows td:nth-child(2){display:inline;width:auto;color:var(--mute);margin-left:6px}:root.phone #rows td:first-child{display:inline;width:auto}
:root.phone #rows td.item{padding-top:6px}
:root.phone #rows tr:not(.open) td.doc,:root.phone #rows tr:not(.open) td.date,:root.phone #rows tr:not(.open) td.note{display:none}
:root.phone #rows td[data-l]::before{font-size:var(--fl,13px)}:root.phone #rows td:first-child::before,:root.phone #rows td:nth-child(2)::before,:root.phone #rows td.item::before{display:none}
:root.phone #docsPane>p.sub{display:none}
:root.phone #docRows tr.drow{cursor:pointer}:root.phone #docRows tr.drow td.num{order:2}
:root.phone #docRows .ib{display:none}
:root.phone .sv{z-index:70}
/* ---------- desktop Checks: two panels and a divider. Left: type and category pills beside the search and a one line
   per check list; right: the picked check in full. The old table, chips and bar stay for the phone ---------- */
:root{--nw-bg:color-mix(in srgb,#2aa765 24%,var(--card));--nw-ink:#86efac;--nw-line:#34a46a}
:root[data-theme="light"]{--nw-bg:#dcf3e5;--nw-ink:#166534;--nw-line:#2aa765}
#ck{display:none}
:root:not(.phone) #checksPane>.chips,:root:not(.phone) #checksPane>.bar,:root:not(.phone) #checksPane>table,:root:not(.phone) #checksPane>.more,:root:not(.phone) #about{display:none}
:root:not(.phone) #ck{display:flex;height:calc(100vh - var(--tb,0px) - 40px);min-height:420px;--ckw:780px}
.ck-l{flex:0 0 var(--ckw);min-width:520px;max-width:70%;display:grid;grid-template-columns:190px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:0}
.ck-f{flex:0 0 190px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;overflow:auto;min-height:0}

.ck-p i{flex:none;width:9px;height:9px;border-radius:50%}.ck-p s{text-decoration:none;overflow:hidden;text-overflow:ellipsis}.ck-p em{font-style:normal;color:var(--mute);font-weight:600}
.ck-p.on{border-color:var(--th);box-shadow:inset 0 0 0 1px var(--th);background:var(--th-t)}.ck-p.z:not(.on){opacity:.45}

/* one grid for the header and the rows; minmax(0, …) so a long cell is cut, never pushed over the next */
.ck-gh,.ck-row{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1.6fr);gap:8px;align-items:center}

.ck-dv i b{width:3px;height:3px;border-radius:50%;background:var(--mute)}
.ck-dv:hover::before,.ck-dv.drag::before{background:var(--gold)}.ck-dv:hover i,.ck-dv.drag i{border-color:var(--gold)}.ck-dv:hover i b,.ck-dv.drag i b{background:var(--gold)}
body.splitting{cursor:col-resize;user-select:none}
.ck-x{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 22px;overflow:auto;font-size:14px;line-height:1.45}
.ck-b{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--c);border:1.5px solid var(--c);border-radius:8px;padding:2px 9px}.ck-b i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.ck-x h2{margin:10px 0 8px;font-size:var(--fh,22px);line-height:1.25;overflow-wrap:anywhere}
.ck-kv{width:100%;border-collapse:collapse;background:none;border-radius:0;font-size:14px;margin:0 0 6px}.ck-kv td{padding:6px 8px;border-top:0;border-bottom:1px solid var(--line);vertical-align:top}
.ck-kv td:first-child{color:var(--mute);width:120px}.ck-kv small{display:block;color:var(--mute);font-size:12.5px}

.ck-dh u{text-decoration:none;letter-spacing:0;text-transform:none;font-size:11.5px;color:var(--nw-ink);border:1px solid var(--nw-line);border-radius:5px;padding:0 5px}
.ck-nt{margin-top:12px;border-radius:10px;background:var(--card2);padding:12px;line-height:1.5}
@media (max-width: 760px){
  table:not(.sv-tb),table:not(.sv-tb) thead,table:not(.sv-tb) tbody,table:not(.sv-tb) tr,table:not(.sv-tb) td{display:block;width:100%}
  table:not(.sv-tb) thead{display:none}
  table:not(.sv-tb) tr{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card);padding:6px 4px}
  table:not(.sv-tb) td{border:0;padding:4px 8px}
  td[data-l]::before{content:attr(data-l);display:block;font-size:var(--fl,13px);font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mute)}
  table:not(.sv-tb){background:none}
  #docRows tr.drow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;padding:8px 10px}

  #docRows tr.drow td.num{grid-column:1 / -1;font-size:var(--fb,15px);color:var(--mute)}
  #docRows tr.drow td.tb{grid-column:1 / -1;margin-top:4px}

  #docRows table.hist tr{display:flex;gap:14px;border:0;border-radius:0;margin:0;padding:1px 0;background:none}#docRows table.hist td{width:auto}#docRows tr.dinfo td{border-radius:0 0 12px 12px}
  .hist table{background:var(--card2)}.hist tr{display:flex;gap:10px;border:0;border-radius:0;margin:0;padding:2px 6px;background:none}.hist td{width:auto;padding:2px 0}
}

<body>
<script src="tabs.js" data-early="phone"></script>
<div class="page">
  <header>
    <h1>Project <span>Checks</span></h1>
    <a class="btn" href="index.html?cards">Flashcards</a>
    <a class="btn" href="pfd.html">Smart PFD</a>
    <button class="btn" id="updBtn">Update app</button>
  </header>
  <div class="ver" id="ver"></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabChecks" aria-selected="true">Checks <span id="nChecks"></span></button>
    <button class="tab" role="tab" id="tabDocs" aria-selected="false">Source documents <span id="nDocs"></span></button>
  </div>
  <div id="docsPane" hidden>
    <div id="slRoot"></div>
    <div hidden><p class="sub" id="docsRule"></p>
    <table>
      <thead><tr><th>Document number</th><th>Title</th><th>Rev</th><th>Original tables</th></tr></thead>
      <tbody id="docRows"></tbody>
    </table></div>
  </div>
  <div id="checksPane">
  <button type="button" id="about">About these checks</button>
  <div class="chips" id="sevChips"></div>
  <div class="bar">
    <input id="q" type="search" placeholder="Filter by tag, document or words" autocomplete="off" data-lpignore="true" data-1p-ignore="true">
    <select id="cat"><option value="">All categories</option></select>
    <button class="btn primary" id="xls">Export to Excel</button>
    <span class="count" id="count"></span>
  </div>
  <table>
    <thead><tr><th>Type</th><th>Category</th><th>Item</th><th>What document 1 says</th><th>Document 1</th><th>Date 1</th><th>What document 2 says</th><th>Document 2</th><th>Date 2</th><th>Comment (which is taken as true and why)</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="more" id="more"></div>
  <div id="ck">
    <div class="ck-l"><div class="ck-f" id="ckF"><div id="ckP" style="display:contents"></div></div>
      <div class="ck-r" id="ckR"><div class="ck-gh"><span></span><span>Item</span><span>Comment</span></div><div class="ck-list" id="ckList"></div></div></div>
    <div class="ck-dv" id="ckDv" role="separator" aria-orientation="vertical" title="Drag to resize, double click to reset"><i><b></b><b></b><b></b></i></div>
    <div class="ck-x" id="ckX"></div>
  </div>
  </div>
</div>
<iframe id="pfdFrame" title="Diagram checks" style="position:absolute;left:-9999px;top:0;width:1600px;height:900px;border:0" aria-hidden="true"></iframe>
<script src="app-update.js"></script>
<script src="sort.js"></script>
<script src="xlsx-lite.js"></script>
<script src="sources-view.js"></script>
<script src="offline.js"></script>
<script src="sp.js"></script>
<script src="sources-list.js"></script>
<script src="checks-state.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const SEV = ["Decision", "Clash", "Missing", "Placeholder", "Check", "Diagram"];
  const SEVC = { Decision: "var(--s-decision)", Clash: "var(--s-clash)", Missing: "var(--s-missing)", Placeholder: "var(--s-placeholder)", Check: "var(--s-check)", Diagram: "var(--s-diagram)" };
  const SEVTIP = { Decision: "Documents disagree; the app made a choice", Clash: "Same item, different value in two lists", Missing: "In one list, not the other",
    Placeholder: "Deleted or unnumbered tag", Check: "Possibly fine, worth checking", Diagram: "Smart PFD layout and data checks" };
  let all = [], off = new Set(), shown = 200, cats = new Set();   // cats: the categories picked on the desktop (none = all)
  const MON = "Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec".split(" ");
  const fmt = d => d ? `${d.slice(8, 10)} ${MON[+d.slice(5, 7) - 1]} ${d.slice(0, 4)}` : "";
  // date cell; the newer of the two dates is marked, as the newer document is taken as true
  const dcell = (a, b) => !a ? "–" : `<span class="${b && a > b ? "newer" : ""}"${b && a > b ? ' title="Newer document"' : ""}>${fmt(a)}</span>`;
  AppUpdate.mount($("updBtn"), $("ver"));
  const PHONE = window.Tabs && Tabs.phone;
  if (PHONE){ Tabs.mount({ active: "more", openMore: false, title: location.hash === "#sources" ? "Sources" : "Checks",
      onPop: st => { if (st.s === "sources" || st.s === "checks"){ popping = true; tab(st.s === "sources" ? "docs" : "checks"); popping = false; } },
      onHome: () => { popping = true; tab("checks"); popping = false; $("q").value = ""; off = new Set(); shown = 200; chips(); draw(); scrollTo(0, 0); return true; } }); Tabs.slot($("q")); $("q").placeholder = "Filter the checks";
    $("about").onclick = () => { const on = $("checksPane").classList.toggle("about"); $("about").textContent = on ? "Hide the explanation" : "About these checks"; };
    $("rows").addEventListener("click", e => { const tr = e.target.closest("tr"); if (tr) tr.classList.toggle("open"); }); }
  else if (window.Tabs){ Tabs.mount({ active: location.hash === "#sources" ? "sources" : "checks",
      onTab: t => { if (t !== "sources" && t !== "checks") return false; tab(t === "sources" ? "docs" : "checks"); return true; },
      onPop: st => { if (st.s === "sources" || st.s === "checks"){ popping = true; tab(st.s === "sources" ? "docs" : "checks"); popping = false; } } }); }

  function chips(){
    $("sevChips").innerHTML = SEV.map(s => { const n = all.filter(r => r.sev === s).length;
      const solo = off.size === SEV.length - 1 && !off.has(s);
      return `<button class="chip${off.has(s) ? " off" : ""}${solo ? " solo" : ""}" data-s="${s}" title="${SEVTIP[s]}" style="--c:${SEVC[s]}"><i style="background:${SEVC[s]}"></i>${s} <span>${n}</span></button>`; }).join("");
    // phone: a tile shows only its type; tapping it again shows them all
    $("sevChips").querySelectorAll(".chip").forEach(b => b.onclick = () => { const s = b.dataset.s;
      if (PHONE){ const solo = off.size === SEV.length - 1 && !off.has(s); off = new Set(solo ? [] : SEV.filter(x => x !== s)); }
      else off.has(s) ? off.delete(s) : off.add(s); shown = 200; chips(); draw(); });
    const cats = [...new Set(all.map(r => r.cat))].sort(), cur = $("cat").value;
    $("cat").innerHTML = '<option value="">All categories</option>' + cats.map(c => `<option${c === cur ? " selected" : ""}>${esc(c)}</option>`).join("");
  }
  // skip: "sev" or "cat" leaves that filter out, so a pill's count is what clicking it would show
  const filtered = skip => { const q = $("q").value.toLowerCase().trim(), c = $("cat").value, words = q.split(/\s+/).filter(Boolean);
    return all.filter(r => (skip === "sev" || !off.has(r.sev)) && (!c || r.cat === c) && (skip === "cat" || !cats.size || cats.has(r.cat)) && (!words.length || words.every(w => (r.item + " " + r.v1 + " " + r.d1 + " " + r.v2 + " " + r.d2 + " " + r.note + " " + r.cat).toLowerCase().includes(w)))); };
  function draw(reset){
    if (!PHONE) return desk(reset);
    const f = filtered();
    $("count").textContent = `${f.length} of ${all.length} shown`; $("nChecks").textContent = `(${all.length})`;
    $("rows").innerHTML = f.slice(0, shown).map(r => `<tr><td data-l="Type"><span class="sev" style="background:${SEVC[r.sev]}">${esc(r.sev)}</span></td><td data-l="Category">${esc(r.cat)}</td>
      <td class="item" data-l="Item">${esc(r.item)}</td><td data-l="Document 1 says">${esc(r.v1)}</td><td class="doc" data-l="Document 1">${esc(r.d1)}</td><td class="date" data-l="Date 1">${dcell(r.date1, r.date2)}</td>
      <td data-l="Document 2 says">${esc(r.v2) || "–"}</td><td class="doc" data-l="Document 2">${esc(r.d2) || "–"}</td><td class="date" data-l="Date 2">${dcell(r.date2, r.date1)}</td><td class="note" data-l="Comment">${esc(r.note)}</td></tr>`).join("");
    $("more").innerHTML = f.length > shown ? `<button class="btn" id="moreBtn">Show ${Math.min(500, f.length - shown)} more</button>` : "";
    if ($("moreBtn")) $("moreBtn").onclick = () => { shown += 500; draw(); };
  }
  // Source documents tab: every document the app is built from, newest revision first
  let DOCS = {};
  const docRev = v => v.revText || (v.rev ? "Rev " + v.rev : "–");
  // the drawings and the spec are sources too (they aren't compared in the checks, so build_issues.py doesn't list them)
  const EXTRA = {
    pid: { number: "2000-Fxx-PID-PR series", full: "P&IDs", title: "P&IDs", kind: "Drawing", revText: "Each its own", used: "Every drawing opened from an item, the tags and drawing numbers on the sheets, and the drawing search", note: "Each sheet carries its own revision in its title block; the newest issue of each is used." },
    spec: { number: "2000-F00-STS-PP-10001", full: "Piping and Valve Specification", title: "Pipe & valve spec", kind: "Specification", rev: "3", used: "Pipe classes and valve datasheets shown for every line and valve" } };
  fetch("PIDs/index.json").then(r => r.json()).then(d => { const n = Object.keys(d.pids).filter(k => /-PID-/.test(k)).length;
    EXTRA.pid.n = n; EXTRA.pid.note = `${n} drawings. ` + EXTRA.pid.note; const td = document.querySelector('#docRows td.tb[data-k="pid"]'); if (td) td.textContent = `${n} drawings`; }).catch(() => {});
  const review = v => v.review ? v.review + (v.review_date ? " (" + fmt(v.review_date) + ")" : "") : "–";
  const docList = () => Object.entries(DOCS).map(([k, v]) => ({ ...v, k })).sort((a, b) => (b.date || "0").localeCompare(a.date || "0"));
  function sources(m){
    DOCS = Object.assign({}, m.docs || {}, EXTRA);
    $("nDocs").textContent = `(${Object.keys(DOCS).length})`;
    $("docsRule").textContent = m.rule + " Each revision and date is read from the document's own revision block (spreadsheet cover page, drawing title block or report cover). Newest first.";
    // one line per document: number, title with ⓘ, rev, the two table buttons; everything else opens under the ⓘ
    const kv = (l, v) => v ? `<div><span>${l}</span>${v}</div>` : "";
    $("docRows").innerHTML = docList().map(v => `<tr class="drow"><td class="num" data-l="Document number">${esc(v.number)}</td>
      <td data-l="Title"><b>${esc(v.full)}</b> <button class="ib" type="button" aria-expanded="false" title="Details">ⓘ</button></td>
      <td data-l="Rev" style="white-space:nowrap"><b>${esc(docRev(v))}</b></td><td data-l="Original tables" class="tb" data-k="${v.k}">–</td></tr>
      <tr class="dinfo" hidden><td colspan="4"><div class="dkv">${kv("Type", esc(v.kind))}${kv("Revision date", fmt(v.date))}${kv("Status", esc(v.status))}${kv("Client review", v.review ? esc(review(v)) : "")}
        ${kv("Used in the app for", esc(v.used))}${v.full !== v.title ? kv("Called in the checks", "“" + esc(v.title) + "”") : ""}${kv("Note", esc(v.note))}
        ${v.sheets ? kv("Sheets", `${v.sheets.length}: ${esc(v.sheets[0].slice(-5))} to ${esc(v.sheets[v.sheets.length - 1].slice(-5))}`) : ""}<div class="trows" data-k="${v.k}"></div></div>
        ${v.history && v.history.length > 1 ? `<div class="dh">Revision history</div><table class="hist">${v.history.slice().reverse().map(h => `<tr><td>Rev ${esc(h.rev)}</td><td class="date">${fmt(h.date)}</td><td>${esc(h.status)}</td></tr>`).join("")}</table>` : ""}</td></tr>`).join("");
    { const td = $("docRows").querySelector('td.tb[data-k="pid"]'); if (td && EXTRA.pid.n) td.textContent = `${EXTRA.pid.n} drawings`; }
    { const td = $("docRows").querySelector('td.tb[data-k="spec"]'); if (td) td.innerHTML = `<div class="tb-btns"><a class="btn" href="spec/pvs.pdf" target="_blank" rel="noopener">PDF 9.3 MB</a></div>`; }
    if (PHONE) $("docRows").querySelectorAll("tr.drow").forEach(r => r.onclick = e => { if (!e.target.closest("button, a")) r.querySelector(".ib").click(); });
    $("docRows").querySelectorAll(".ib").forEach(b => b.onclick = () => { const r = b.closest("tr").nextElementSibling, open = r.hidden; r.hidden = !open; b.setAttribute("aria-expanded", open); b.classList.toggle("on", open); });
    SourceView.index().then(ix => document.querySelectorAll("#docRows td.tb").forEach(td => tables(td, ix[td.dataset.k], DOCS[td.dataset.k]))).catch(() => {});
  }
  function tables(td, d, v){
    if (!d) return;
    const n = d.sheets.length, rows = d.sheets.reduce((t, s) => t + s.n, 0), kb = d.size > 1e6 ? (d.size / 1e6).toFixed(1) + " MB" : Math.round(d.size / 1e3) + " kB";
    td.innerHTML = `<div class="tb-btns"><button class="btn" data-open title="View the original tables">${n} table${n > 1 ? "s" : ""}</button><a class="btn" href="${esc(d.xlsx)}" download="${esc(d.fname)}" title="Download the tables as Excel">Excel ${kb}</a></div>`;
    const tr = document.querySelector(`#docRows .trows[data-k="${td.dataset.k}"]`);
    if (tr) tr.innerHTML = `<div><span>Tables</span>${rows.toLocaleString()} rows. ${d.from === "PDF" ? "Pulled from the PDF." : "All sheets except the cover page."}</div>`;
    td.querySelector("[data-open]").onclick = () => SourceView.open(td.dataset.k, `${v.number} ${v.full}${v.rev ? " Rev " + v.rev : ""}`);
  }
  function tab(which){
    const docs = which === "docs";
    $("tabDocs").setAttribute("aria-selected", docs); $("tabChecks").setAttribute("aria-selected", !docs);
    $("docsPane").hidden = !docs; $("checksPane").hidden = docs;
    const st = { s: docs ? "sources" : "checks" }, url = docs ? "#sources" : location.pathname + location.search;
    if (PHONE && !popping && history.state && history.state.s && history.state.s !== st.s) history.pushState(Object.assign(st, { d: (history.state.d || 0) + 1 }), "", url);
    else history.replaceState(Object.assign({}, history.state || {}, st), "", url);
    if (!PHONE && window.Tabs && Tabs.set) Tabs.set(docs ? "sources" : "checks");
    if (PHONE){ Tabs.title(docs ? "Sources" : "Checks"); $("q").placeholder = docs ? "Filter the sources" : "Filter the checks"; }
  }
  const SL = SourcesList.mount($("slRoot"), PHONE ? { phone: true, input: $("q") } : {});
  $("tabChecks").onclick = () => tab("checks"); $("tabDocs").onclick = () => tab("docs");
  // Back between Checks and Sources (phone, More → the other one); a link to #sources on this page switches too
  let popping = false;
  addEventListener("hashchange", () => tab(location.hash === "#sources" ? "docs" : "checks"));
  if (location.hash === "#sources" || PHONE) tab("docs");   // (the phone has no Checks)
  const docSheet = () => ({ name: "Sources", widths: [30, 50, 12, 6, 14, 40, 26, 60, 60],
    rows: [["Document number", "Title", "Type", "Rev", "Revision date", "Status", "Client review", "Used in the app for", "Note"],
      ...docList().map(v => [v.number, v.full, v.kind, v.rev, fmt(v.date), v.status, review(v) === "–" ? "" : review(v), v.used, v.note || ""])] });
  const histSheet = () => ({ name: "Revision history", widths: [30, 50, 6, 14, 50],
    rows: [["Document number", "Title", "Rev", "Date", "Status"], ...docList().flatMap(v => (v.history || []).map(h => [v.number, v.full, h.rev, fmt(h.date), h.status]))] });
  if ($("xlsDocs")) $("xlsDocs").onclick = () => XLSX.download(`Project source documents ${new Date().toISOString().slice(0, 10)}.xlsx`, [docSheet(), histSheet()]);
  // on the phone the one filter box serves whichever of the two is open
  $("q").oninput = () => { if (PHONE && !$("docsPane").hidden) return;   // (Sources reads the box itself)
    if (false){ const w = $("q").value.toLowerCase().split(/\s+/).filter(Boolean);
      document.querySelectorAll("#docRows tr.drow").forEach(r => { const hide = w.length && !w.every(x => r.textContent.toLowerCase().includes(x)); r.hidden = hide; if (hide) r.nextElementSibling.hidden = true; }); return; }
    shown = 200; draw(true); }; $("cat").onchange = () => { shown = 200; draw(); };
  $("xls").onclick = () => {
    const f = filtered(), head = ["Type", "Category", "Item", "What document 1 says", "Document 1", "Date 1", "What document 2 says", "Document 2", "Date 2", "Comment (which is taken as true and why)"];
    XLSX.download(`Project checks ${new Date().toISOString().slice(0, 10)}.xlsx`, [
      { name: "Checks", widths: [12, 16, 26, 45, 34, 12, 45, 34, 12, 60], rows: [head, ...f.map(r => [r.sev, r.cat, r.item, r.v1, r.d1, fmt(r.date1), r.v2, r.d2, fmt(r.date2), r.note])] },
      docSheet(),
      { name: "Types", widths: [14, 60, 10], rows: [["Type", "Meaning", "Count"], ...SEV.map(s => [s, SEVTIP[s], all.filter(r => r.sev === s).length])] }]);
  };

  // ---------- desktop: pills | search and one line per check | the picked check in full ----------
  const PL = { Decision: "decisions", Clash: "clashes", Missing: "missing", Placeholder: "placeholders", Check: "checks", Diagram: "diagram checks" };
  const newer = r => r.win ? r.win : r.date1 && r.date2 ? (r.date1 > r.date2 ? 1 : r.date2 > r.date1 ? 2 : 0) : 0;
  let F = [], cur = null;   // the list as drawn, the picked check (kept while it stays in the list)
  if (!PHONE){ document.querySelector(".ck-l").prepend($("q")); $("ckR").prepend($("count")); $("ckF").append($("xls")); $("xls").textContent = "Export to Excel"; }
  // desktop: one pill at a time (sel). A check carries tags (its type, its category, Resolved once ticked) and shows when
  // the pill picked is one of them; with no pill, every open check. Resolved checks show only under Resolved.
  let sel = null;   // { g: "r" | "s" | "c", v }
  const resd = r => window.CK && CK.isRes(CK.id(r)), redOf = r => window.CK && CK.RED.has(r.sev) && !resd(r);
  const tagHit = (r, t) => !t ? !resd(r) : t.g === "r" ? resd(r) : !resd(r) && (t.g === "s" ? r.sev === t.v : r.cat === t.v);
  function desk(reset){
    const base = filtered("sev").filter(r => !$("cat").value || r.cat === $("cat").value);
    F = base.filter(r => tagHit(r, sel)); const n = F.length, open = base.filter(r => !resd(r)), cnt = (a, k, v) => a.reduce((t, r) => t + (r[k] === v), 0);
    $("nChecks").textContent = `(${all.length})`;
    $("count").innerHTML = `<span>${sel ? (sel.g === "s" ? PL[sel.v] : sel.g === "r" ? "Resolved" : sel.v) : "Open checks"}</span><b>${n}</b>`;
    // categories in a fixed order (most checks first), so the pills don't jump about as the counts change
    const byCat = {}; all.forEach(r => byCat[r.cat] = (byCat[r.cat] || 0) + 1);
    const pill = (k, on, c, dot) => `<button class="ck-p${on ? " on" : ""}${c ? "" : " z"}" data-${dot === 2 ? "r" : dot ? "s" : "c"}="${esc(k)}"${dot === 2 ? ' title="Checks marked resolved"' : dot ? ` title="${SEVTIP[k]}"` : ` title="${esc(k)}"`}>${dot ? `<i style="background:${dot === 2 ? "var(--s-resolved,#1a8a3a)" : SEVC[k]}"></i>` : ""}<s>${esc(k)}</s><em>${c}</em></button>`;
    const nRes = base.filter(resd).length, is = (g, v) => !!sel && sel.g === g && sel.v === v;
    $("ckP").innerHTML = `<div class="ck-h">Type</div>${pill("Resolved", is("r", "Resolved"), nRes, 2)}${SEV.map(s => pill(s, is("s", s), cnt(open, "sev", s), 1)).join("")}
      <div class="ck-h">Category</div>${Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a] || a.localeCompare(b)).map(c => pill(c, is("c", c), cnt(open, "cat", c))).join("")}`;
    const L = $("ckList"), top = L.scrollTop;
    L.innerHTML = n ? F.map((r, i) => `<div class="ck-row${redOf(r) ? " red" : ""}" data-i="${i}"><span><button class="ck-tk${resd(r) ? " on" : ""}" title="${resd(r) ? "Resolved: untick to reopen" : "Mark as resolved"}" aria-label="Resolved"></button></span><b title="${esc(r.item)}">${esc(r.item)}</b><span class="ck-c" title="${esc(r.note)}">${esc(r.note)}</span></div>`).join("")
      : `<div class="ck-none">No checks match.</div>`;
    L.scrollTop = reset ? 0 : top;
    pick(F.includes(cur) ? cur : F[0], false);
  }
  // the right panel: the check in full; the newer document is taken as true, so its statement is marked
  addEventListener("kcgm-sp", () => { if (typeof cur !== "undefined" && cur) pick(cur); });
  function pick(r, scroll){
    cur = r || null; const L = $("ckList"), i = F.indexOf(cur);
    L.querySelectorAll(".ck-row.sel").forEach(e => e.classList.remove("sel"));
    const el = L.querySelector(`.ck-row[data-i="${i}"]`); if (el){ el.classList.add("sel"); if (scroll) el.scrollIntoView({ block: "nearest" }); }
    if (!r){ $("ckX").innerHTML = `<div class="ck-none">${all.length ? "Nothing picked: no checks match the filters." : ""}</div>`; return; }
    const lt = t => window.SP ? SP.linkText(t) : esc(t);   // documents the app doesn't hold link to SharePoint
    const w = newer(r), doc = (k, d, dt) => d ? `<tr><td>Document ${k}</td><td>${lt(d)}${dt ? `<small>${fmt(dt)}${w === k ? " · newer" : ""}</small>` : ""}</td></tr>` : "";
    const says = (k, v) => v ? `<div class="ck-st${w === k ? " nw" : ""}"><div class="ck-dh"><span>What document ${k} says</span>${w === k ? "<u>taken as true</u>" : ""}</div>${lt(v)}</div>` : "";
    const ri = window.CK ? CK.info(CK.id(r)) : null;
    const rbox = `<div class="ck-rs${ri ? " on" : ""}"><label><button class="ck-tk${ri ? " on" : ""}" aria-label="Resolved"></button><span>${ri ? "Resolved" : "Mark as resolved"}</span></label>
      ${ri ? `<div class="ck-rw">${esc(ri.by || "")}${ri.at ? " · " + fmt(String(ri.at).slice(0, 10)) : ""}${ri.note ? `<div class="ck-rn">${esc(ri.note)}</div>` : ""}</div>`
        : `<textarea class="ck-note" placeholder="Note (optional, kept on record), e.g. MEL to be revised, confirmed with Primero"></textarea><div class="ck-rh">Saved to GitHub for everyone, with your name and the date. Untick later to put it back in its type.</div>`}<div class="ck-rm"></div></div>`;
    $("ckX").innerHTML = `<span class="ck-b" style="--c:${SEVC[r.sev]}"><i></i>${esc(r.sev)}</span><h2>${esc(r.item)}</h2>${rbox}
      <table class="ck-kv"><tr><td>Category</td><td>${esc(r.cat)}</td></tr>${doc(1, r.d1, r.date1)}${doc(2, r.d2, r.date2)}</table>
      ${says(1, r.v1)}${says(2, r.v2)}${r.note ? `<div class="ck-nt"><div class="ck-dh"><span>Comment</span></div>${lt(r.note)}</div>` : ""}`;
    $("ckX").scrollTop = 0;
  }
  if (!PHONE){
    // type pills: the first click shows only that type, later clicks add or drop types; none left is all of them
    $("ckF").addEventListener("click", e => { const b = e.target.closest(".ck-p"); if (!b) return;
      const t = b.dataset.r ? { g: "r", v: "Resolved" } : b.dataset.s ? { g: "s", v: b.dataset.s } : { g: "c", v: b.dataset.c };
      sel = sel && sel.g === t.g && sel.v === t.v ? null : t;   // (the same pill again: back to every open check)
      draw(true); });
    // ticking: resolves (with the note, in the detail) or reopens; the list redraws with the check moved
    const tick = async (r, el) => { if (!window.CK) return; const on = !CK.isRes(CK.id(r)), m = $("ckX").querySelector(".ck-rm"), note = (($("ckX").querySelector(".ck-note") || {}).value || "");
      if (!on && !confirm(`Reopen "${r.item}"? It goes back to ${r.sev}.`)) return;
      el.classList.add("busy"); if (m) m.textContent = "Saving…";
      try { await CK.set(CK.id(r), on, note); cur = r; draw(); }
      catch (e){ el.classList.remove("busy"); if (m){ m.textContent = e.message; m.classList.add("bad"); } else alert(e.message); if (e.key && window.Tabs && Tabs.keys) Tabs.keys(); } };
    $("ckList").addEventListener("click", e => { const t = e.target.closest(".ck-tk"); if (!t) return; e.stopPropagation(); const el = e.target.closest(".ck-row"); pick(F[+el.dataset.i]); tick(F[+el.dataset.i], t); }, true);
    $("ckX").addEventListener("click", e => { const t = e.target.closest(".ck-rs .ck-tk, .ck-rs label"); if (t && cur){ e.preventDefault(); tick(cur, $("ckX").querySelector(".ck-rs .ck-tk")); } });
    addEventListener("kcgm-checks", () => { const m = location.hash.match(/^#c=([0-9a-f]{8})$/); if (m && window.CK){ const r = all.find(x => CK.id(x) === m[1]);
        if (r){ sel = CK.isRes(m[1]) ? { g: "r", v: "Resolved" } : null; history.replaceState(history.state, "", location.pathname); draw(true); pick(r, true); return; } } draw(); });
    window.CK && CK.load();
    $("ckList").addEventListener("click", e => { const el = e.target.closest(".ck-row"); if (el) pick(F[+el.dataset.i]); });
    // up and down move the pick (also while typing in the search box), unless the Sources view is open
    addEventListener("keydown", e => { if ((e.key !== "ArrowDown" && e.key !== "ArrowUp") || $("checksPane").hidden || !F.length || e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.target.closest && e.target.closest("select, textarea, .sv")) return;
      const i = Math.max(0, Math.min(F.length - 1, F.indexOf(cur) + (e.key === "ArrowDown" ? 1 : -1))); e.preventDefault(); pick(F[i], true); });
    // the divider: drag to share the width (kept on this computer), double click for the default
    { const dv = $("ckDv"), ck = $("ck"), DEF = 780;
      const setW = w => { w = Math.round(Math.max(520, Math.min(ck.clientWidth * .7, w))); ck.style.setProperty("--ckw", w + "px"); return w; };
      try { const w = +localStorage.getItem("kcgm_chkw"); if (w) ck.style.setProperty("--ckw", w + "px"); } catch (e) {}   // (clamped by the CSS until the first drag)
      let x0 = 0, w0 = 0, on = false;
      dv.addEventListener("pointerdown", e => { on = true; x0 = e.clientX; w0 = ck.firstElementChild.getBoundingClientRect().width; dv.setPointerCapture(e.pointerId); dv.classList.add("drag"); document.body.classList.add("splitting"); e.preventDefault(); });
      dv.addEventListener("pointermove", e => { if (on) setW(w0 + e.clientX - x0); });
      const end = () => { if (!on) return; on = false; dv.classList.remove("drag"); document.body.classList.remove("splitting");
        try { localStorage.setItem("kcgm_chkw", Math.round(ck.firstElementChild.getBoundingClientRect().width)); } catch (e) {} };
      dv.addEventListener("pointerup", end); dv.addEventListener("pointercancel", end);
      dv.addEventListener("dblclick", () => { ck.style.setProperty("--ckw", DEF + "px"); try { localStorage.removeItem("kcgm_chkw"); } catch (e) {} }); }
  }

  // list checks (built offline)
  fetch("issues.json").then(r => r.json()).then(d => { all = all.concat(d.rows); sources(d.meta); chips(); draw(); diagram(); }).catch(e => { $("count").textContent = "Couldn't load issues.json: " + e.message; diagram(); });

  // diagram checks: load the Smart PFD invisibly and run its self check
  function diagram(){
    const fr = $("pfdFrame"); $("count").textContent += " · running diagram checks…";
    fr.onload = () => setTimeout(() => { try {
      const w = fr.contentWindow, g = n => w.eval(n), r = w.pfdCheck(), add = (cat, item, v1, note) => all.push({ sev: "Diagram", cat, item, v1, d1: "Smart PFD", v2: "", d2: "", note });
      const STREAMS = g("STREAMS"), NODES = g("NODES"), LOOPS = g("LOOPS"), SD = g("STREAM_DATA"), EQ = g("EQUIP_DATA"), INS = g("INSTR_DATA"), CV = g("CV_DATA"), exp = w.expandTag;
      r.short.forEach(x => add("Layout", x.split(":")[0], "Line " + x.split(":")[1].replace(">", " to ") + " is shorter than its tph box", "Spread the equipment (tools/relayout.js)."));
      r.labelHits.forEach(x => add("Layout", x, "Name box overlaps " + x.split("/")[1], "Move one of the symbols."));
      r.headers.forEach(x => add("Layout", x.replace(/ cost \d+$/, ""), "Area title is crossed by a line", "No clear spot on the area edge; accepted."));
      r.jogs.forEach(x => add("Layout", x.split(" ")[0], "Line has a small step of " + x.split(" ")[1] + " units", "Straighten the route."));
      r.boxHits.forEach(x => add("Layout", x.split(" ")[0], "tph box touches another line or symbol", "Minor; box placed on the clearest run available."));
      const slurry = ["ore", "flot", "conc", "tails", "leach"];
      STREAMS.filter(s => slurry.includes(s.ty) && !(SD[s.id] && SD[s.id].sol != null)).forEach(s => all.push({ sev: "Diagram", cat: "Stream data", item: s.id, v1: s.n + ": no solids tonnage", d1: "Smart PFD (pfd-streams.js)", v2: "Not given for this line", d2: "PDC 2000-F00-DCR-PR-10002 Rev 4", note: "Shown as not specified; no tph box on the line." }));
      NODES.filter(n => !EQ[n.id] && !["rom", "tsf", "gold", "gidji", "dams"].includes(n.id)).forEach(n => add("Equipment data", n.id, n.n + ": no MEL item mapped", "Equipment panel shows no MEL data."));
      LOOPS.forEach(L => [...(L.m || []), ...(L.f || [])].forEach(t => exp(t).forEach(x => { if (/^F\d\d-/.test(x) || INS[x] || CV[x]) return;
        all.push({ sev: "Diagram", cat: "Loop device", item: x, v1: `Used in the ${L.tag} loop "${L.name}"`, d1: "Smart PFD (pfd-data.js)", v2: "Not found", d2: "Instrument List 2000-F00-LST-IC-11011 / Control Valve List", note: "Tag taken from the loop drawing; check numbering." }); })));
      chips(); draw();
    } catch (e) { $("count").textContent = `${all.length} list checks; diagram checks failed (${e.message})`; } }, 1500);
    fr.src = "pfd.html";
  }
})();
</script>
</body>

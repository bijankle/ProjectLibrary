<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<script>
// App size (textsize.js) set before the first paint, so every page opens at the chosen size: on a phone the page is
// laid out narrower (screen width / size) and the zoom is locked there, like Ctrl + scroll in a browser.
window.kcgmViewport = function(z){ try {
  var m = document.querySelector('meta[name="viewport"]'); if (!m || !matchMedia("(pointer: coarse)").matches) return;
  if (!(z >= .7 && z <= 2.4) || z === 1){ m.setAttribute("content", "width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content"); return; }
  var land = screen.orientation ? /landscape/.test(screen.orientation.type) : innerWidth > innerHeight, w = land ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
  m.setAttribute("content", "width=" + Math.round(w / z) + ", initial-scale=" + z + ", minimum-scale=" + z + ", maximum-scale=" + z + ", viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content");
} catch (e) {} };
// (a phone with no choice yet opens at 1.6, the app's 100%)
try { var z0 = parseFloat(localStorage.getItem("kcgm_text_size")); kcgmViewport(z0 > 0 ? z0 : 1.6); } catch (e) {}
// Theme (one for every page, Settings → Theme): "dark", "light" or "device" (follows the computer / phone), set before
// the first paint as data-theme on <html>
window.kcgmTheme = function(v){ try { v = v || localStorage.getItem("kcgm_theme") || "device";
  document.documentElement.dataset.theme = v === "dark" || (v !== "light" && !matchMedia("(prefers-color-scheme: light)").matches) ? "dark" : "light"; } catch (e) {} };
kcgmTheme();
// Text size (Settings → Text size): the app's three text sizes (titles, labels, body) scaled together, 65, 75, 90, 100
// or 115 percent; set before the first paint as the size variables on <html>
// On a phone the steps are 55, 65, 75, 85, 100 percent (Normal is the old Small; a step chosen before moves up one)
window.kcgmText = function(v){ try { var ph = matchMedia("(pointer: coarse)").matches;
  if (ph && !localStorage.getItem("kcgm_text_m")) { var o = localStorage.getItem("kcgm_text"); if (o) localStorage.setItem("kcgm_text", { xs: "s", s: "n", n: "l", l: "xl", xl: "xl" }[o] || "n"); localStorage.setItem("kcgm_text_m", "1"); }
  v = v || localStorage.getItem("kcgm_text") || "n"; var k = (ph ? { xs: .55, s: .65, n: .75, l: .85, xl: 1 } : { xs: .65, s: .75, n: .9, l: 1, xl: 1.15 })[v] || (ph ? .75 : .9), s = document.documentElement.style;
  s.setProperty("--fh", 22 * k + "px"); s.setProperty("--fl", (ph ? 35 / 3 : 13) * k + "px"); s.setProperty("--fb", 15 * k + "px"); } catch (e) {} };
kcgmText();
try { addEventListener("storage", function(e){ if (e.key === "kcgm_text") { kcgmText(); dispatchEvent(new Event("resize")); } }); } catch (e) {}
try { matchMedia("(prefers-color-scheme: light)").addEventListener("change", function(){ kcgmTheme(); });
  addEventListener("storage", function(e){ if (e.key === "kcgm_theme") kcgmTheme(); }); } catch (e) {}
// the app's accent theme (View > Theme), also before the first paint, as data-accent on <html>; slate unless picked
window.kcgmAccent = function(v){ try { v = v || localStorage.getItem("kcgm_accent") || "slate"; if (!/^(slate|graphite|navy|petrol|olive|stone|rust|ink)$/.test(v)) v = "slate"; document.documentElement.dataset.accent = v; } catch (e) {} };
kcgmAccent();
try { addEventListener("storage", function(e){ if (e.key === "kcgm_accent") kcgmAccent(); }); } catch (e) {}
</script>
<style id="kcgmThemes">
/* accent themes: main, darker, light tint, button fill. Only things that are "the app" follow them (selected pills,
   sliders, tags, buttons, outlines, progress lines); colours that mean something (fluids, check types, stages, warnings,
   search hits, chart series) never do, and the same eight as ActionMap: deep and muted, so none passes for a fluid, check type or search colour */
:root,html[data-accent="slate"]{--thm:#475569;--thd:#334155;--tht:#eef1f5;--thb:#64748b}
html[data-accent="graphite"]{--thm:#52525b;--thd:#3f3f46;--tht:#f0f0f1;--thb:#71717a}
html[data-accent="navy"]{--thm:#1e3a5f;--thd:#132845;--tht:#e8edf4;--thb:#2d4f7c}
html[data-accent="petrol"]{--thm:#1f4f5a;--thd:#143a43;--tht:#e7f0f1;--thb:#2d6673}
html[data-accent="olive"]{--thm:#5a5a2e;--thd:#444422;--tht:#f0f0e6;--thb:#6e6e3a}
html[data-accent="stone"]{--thm:#7a6a5d;--thd:#5f5147;--tht:#f3efeb;--thb:#8f7f71}
html[data-accent="rust"]{--thm:#9a3412;--thd:#7c2a0e;--tht:#f8ece6;--thb:#b4471f}
html[data-accent="ink"]{--thm:#111827;--thd:#000000;--tht:#e9ebef;--thb:#1f2937}
:root{--rh:#eef0f3;--rs:var(--th-t);--rsb:var(--th);--hd:var(--thm);--hd2:#fff;--th:var(--thm);--th2:var(--thd);--th-t:var(--tht);--th-b:var(--thb);--on-th:#fff}
html[data-theme="dark"]{--rh:#262b32;--rs:var(--th-t);--rsb:var(--th);--hd:color-mix(in srgb,var(--thm) 80%,#000);--hd2:#fff;--th:color-mix(in srgb,var(--thm) 62%,#fff);--th2:color-mix(in srgb,var(--thm) 78%,#fff);--th-t:color-mix(in srgb,var(--thm) 32%,#15191e);--th-b:color-mix(in srgb,var(--thb) 80%,#fff)}   /* lifted so it reads on black */
</style>
<link rel="manifest" href="manifest.json?v=3">
<title>Project Library</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--fh:22px;--fl:13px;--fb:15px;--ff:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--bg:#0f1216;--card:#171b21;--card2:#1f252d;--ink:#e9edf2;--mute:#95a1ae;--gold:var(--th);--line:#2c343e}
:root[data-theme="light"]{--bg:#f3f4f6;--card:#fff;--card2:#f0f2f5;--ink:#1d2430;--mute:#5d6875;--gold:var(--th);--line:#d9dee5}
:root{--th:var(--thm);--th2:var(--thd)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff)}
button,input,select{font-family:var(--ff)}
.ex{display:grid;grid-template-columns:380px 1fr;gap:18px;padding:16px 24px 24px;align-items:start}
.ex-l{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.ex-h{font:800 var(--fl,13px) var(--ff);letter-spacing:.5px;text-transform:uppercase;color:#fff;background:var(--th);padding:7px 10px;border-radius:6px 6px 0 0}
.ex-c{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:visible}
.ex-c .bd{padding:10px}
.ex-f{position:relative;margin-bottom:10px}
.ex-f label{display:block;font-weight:800;font-size:var(--fl,13px);color:var(--mute);margin:0 0 4px}
.ex-f input,.ex-c select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:9px 11px;font-size:var(--fb,15px)}
.ex-f input.ok{border-color:var(--th);box-shadow:inset 0 0 0 1px var(--th)}
.ex-sg{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 24px #0003;max-height:320px;overflow:auto}
.ex-sg button{all:unset;box-sizing:border-box;display:flex;gap:8px;width:100%;padding:7px 11px;cursor:pointer;font-size:var(--fb,15px)}
.ex-sg button:hover,.ex-sg button.hi{background:var(--card2)}
.ex-sg b{font-weight:800}.ex-sg em{font-style:normal;color:var(--mute);margin-left:auto;font-size:.85em}
.ex-go{appearance:none;width:100%;border:0;border-radius:10px;padding:11px;font:800 var(--fb,15px) var(--ff);background:var(--th);color:#fff;cursor:pointer}
.ex-go:disabled{opacity:.45;cursor:default}
.ex-msg{font-size:var(--fb,15px);color:var(--mute);line-height:1.4}
.ex-ls{list-style:none;margin:0;padding:0;font-size:var(--fb,15px)}
.ex-ls li{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
.ex-ls li:first-child{border-top:0}
.ex-ls i{width:22px;height:5px;border-radius:3px;flex:none}
.ex-ls .sh{color:var(--mute);margin-left:auto;font-size:.85em;white-space:nowrap}
.ex-r{display:flex;flex-direction:column;gap:18px;min-width:0}
.ex-sheet{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ex-sheet h3{margin:0;padding:8px 12px;font-size:var(--fb,15px);border-bottom:1px solid var(--line);display:flex;gap:10px}
.ex-sheet h3 span{color:var(--mute);font-weight:600}
.ex-pic{position:relative;background:#fff}
.ex-pic img{display:block;width:100%}
.ex-pic svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ex-pic polyline{fill:none;stroke-width:7px;stroke-linecap:round;stroke-linejoin:round;opacity:.6;vector-effect:non-scaling-stroke}
.ex-pic circle{stroke:#fff;stroke-width:2px;vector-effect:non-scaling-stroke}
.ex-empty{padding:40px;text-align:center;color:var(--mute);font-size:var(--fb,15px);border:2px dashed var(--line);border-radius:10px}
.ex-bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:8px}.ex-bar i{display:block;height:100%;background:var(--th);width:0}
</style>
</head>
<body>
<script src="tabs.js"></script>
<div class="ex">
  <div class="ex-l">
    <div class="ex-c"><div class="ex-h">Export a work scope</div><div class="bd">
      <div class="ex-f"><label for="exA">Start asset</label><input id="exA" placeholder="Tag or line number, e.g. F13-HP-401" autocomplete="off" data-lpignore="true" data-1p-ignore="true"><div class="ex-sg" id="sgA" hidden></div></div>
      <div class="ex-f"><label for="exB">End asset</label><input id="exB" placeholder="Tag or line number, e.g. F13-PP-401" autocomplete="off" data-lpignore="true" data-1p-ignore="true"><div class="ex-sg" id="sgB" hidden></div></div>
      <div class="ex-f" id="exRw" hidden><label for="exR">Route</label><select id="exR"></select></div>
      <button class="ex-go" id="exGo" disabled>Export PDF</button>
      <div class="ex-bar" id="exBar" hidden><i></i></div>
      <p class="ex-msg" id="exMsg">Pick two assets. The P&amp;IDs between them are exported as one PDF with the connecting lines highlighted in their fluid colours, after a cover page.</p>
    </div></div>
    <div class="ex-c" id="exSum" hidden><div class="ex-h">Route</div><div class="bd"><ul class="ex-ls" id="exLs"></ul></div></div>
  </div>
  <div class="ex-r" id="exPv"><div class="ex-empty">The sheets on the route show here.</div></div>
</div>
<script src="vendor/pdf-lib/pdf-lib.min.js"></script>
<script src="export.js"></script>
</body>
</html>

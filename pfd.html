<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<script>
// App size (textsize.js) set before the first paint, so every page opens at the chosen size: on a phone the page is
// laid out narrower (screen width / size) and the zoom is locked there, like Ctrl + scroll in a browser.
window.kcgmViewport = function(z){ try {
  var m = document.querySelector('meta[name="viewport"]'); if (!m || !matchMedia("(pointer: coarse)").matches) return;
  if (!(z >= .7 && z <= 2.4) || z === 1){ m.setAttribute("content", "width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content"); return; }
  var land = screen.orientation ? /landscape/.test(screen.orientation.type) : innerWidth > innerHeight, w = land ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
  m.setAttribute("content", "width=" + Math.round(w / z) + ", initial-scale=" + z + ", minimum-scale=" + z + ", maximum-scale=" + z + ", viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content");
} catch (e) {} };
// (a phone with no choice yet opens at 1.6, the app's 100%)
try { var z0 = parseFloat(localStorage.getItem("kcgm_text_size")); kcgmViewport(z0 > 0 ? z0 : 1.6); } catch (e) {}
// Theme (one for every page, Settings → Theme): "dark", "light" or "device" (follows the computer / phone), set before
// the first paint as data-theme on <html>
window.kcgmTheme = function(v){ try { v = v || localStorage.getItem("kcgm_theme") || "device";
  document.documentElement.dataset.theme = v === "dark" || (v !== "light" && !matchMedia("(prefers-color-scheme: light)").matches) ? "dark" : "light"; } catch (e) {} };
kcgmTheme();
// Text size (Settings → Text size): the app's three text sizes (titles, labels, body) scaled together, 65, 75, 90, 100
// or 115 percent; set before the first paint as the size variables on <html>
// On a phone the steps are 55, 65, 75, 85, 100 percent (Normal is the old Small; a step chosen before moves up one)
window.kcgmText = function(v){ try { var ph = matchMedia("(pointer: coarse)").matches;
  if (ph && !localStorage.getItem("kcgm_text_m")) { var o = localStorage.getItem("kcgm_text"); if (o) localStorage.setItem("kcgm_text", { xs: "s", s: "n", n: "l", l: "xl", xl: "xl" }[o] || "n"); localStorage.setItem("kcgm_text_m", "1"); }
  v = v || localStorage.getItem("kcgm_text") || "n"; var k = (ph ? { xs: .55, s: .65, n: .75, l: .85, xl: 1 } : { xs: .65, s: .75, n: .9, l: 1, xl: 1.15 })[v] || (ph ? .75 : .9), s = document.documentElement.style;
  s.setProperty("--fh", 22 * k + "px"); s.setProperty("--fl", (ph ? 35 / 3 : 13) * k + "px"); s.setProperty("--fb", 15 * k + "px"); } catch (e) {} };
kcgmText();
try { addEventListener("storage", function(e){ if (e.key === "kcgm_text") { kcgmText(); dispatchEvent(new Event("resize")); } }); } catch (e) {}
try { matchMedia("(prefers-color-scheme: light)").addEventListener("change", function(){ kcgmTheme(); });
  addEventListener("storage", function(e){ if (e.key === "kcgm_theme") kcgmTheme(); }); } catch (e) {}
// the app's accent theme (View > Theme), also before the first paint, as data-accent on <html>; slate unless picked
window.kcgmAccent = function(v){ try { v = v || localStorage.getItem("kcgm_accent") || "slate"; if (!/^(slate|graphite|navy|petrol|olive|stone|rust|ink)$/.test(v)) v = "slate"; document.documentElement.dataset.accent = v; } catch (e) {} };
kcgmAccent();
try { addEventListener("storage", function(e){ if (e.key === "kcgm_accent") kcgmAccent(); }); } catch (e) {}
</script>
<style id="kcgmThemes">
/* accent themes: main, darker, light tint, button fill. Only things that are "the app" follow them (selected pills,
   sliders, tags, buttons, outlines, progress lines); colours that mean something (fluids, check types, stages, warnings,
   search hits, chart series) never do, and the same eight as ActionMap: deep and muted, so none passes for a fluid, check type or search colour */
:root,html[data-accent="slate"]{--thm:#475569;--thd:#334155;--tht:#eef1f5;--thb:#64748b}
html[data-accent="graphite"]{--thm:#52525b;--thd:#3f3f46;--tht:#f0f0f1;--thb:#71717a}
html[data-accent="navy"]{--thm:#1e3a5f;--thd:#132845;--tht:#e8edf4;--thb:#2d4f7c}
html[data-accent="petrol"]{--thm:#1f4f5a;--thd:#143a43;--tht:#e7f0f1;--thb:#2d6673}
html[data-accent="olive"]{--thm:#5a5a2e;--thd:#444422;--tht:#f0f0e6;--thb:#6e6e3a}
html[data-accent="stone"]{--thm:#7a6a5d;--thd:#5f5147;--tht:#f3efeb;--thb:#8f7f71}
html[data-accent="rust"]{--thm:#9a3412;--thd:#7c2a0e;--tht:#f8ece6;--thb:#b4471f}
html[data-accent="ink"]{--thm:#111827;--thd:#000000;--tht:#e9ebef;--thb:#1f2937}
:root{--rh:#eef0f3;--rs:var(--th-t);--rsb:var(--th);--hd:var(--thm);--hd2:#fff;--th:var(--thm);--th2:var(--thd);--th-t:var(--tht);--th-b:var(--thb);--on-th:#fff}
html[data-theme="dark"]{--rh:#262b32;--rs:var(--th-t);--rsb:var(--th);--hd:color-mix(in srgb,var(--thm) 80%,#000);--hd2:#fff;--th:color-mix(in srgb,var(--thm) 62%,#fff);--th2:color-mix(in srgb,var(--thm) 78%,#fff);--th-t:color-mix(in srgb,var(--thm) 32%,#15191e);--th-b:color-mix(in srgb,var(--thb) 80%,#fff)}   /* lifted so it reads on black */
</style>

}

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const svg = $("svg");
  const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const byId = {}; NODES.forEach(n => byId[n.id] = n);
  const pref = { get(k, d){ try{ return localStorage.getItem(k) ?? d; }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} } };

  let stage = 0, focusFlow = null, stepIx = -1, playing = null, pdcCase = 0, sel = [], lastPanel = null;
  // theme: the app wide setting (kcgmTheme in the head, Settings → Theme)

  // ---------- geometry ----------
  function port(n, side, f = 0){
    switch (side){
      case "r": return [n.x + n.w, n.y + n.h / 2 + f * n.h];
      case "l": return [n.x, n.y + n.h / 2 + f * n.h];
      case "t": { const x = n.x + n.w / 2 + f * n.w;   // lines into/out of the top stop at the name box above the symbol
        return [x, n.lb && x > n.lb.x1 + 3 && x < n.lb.x2 - 3 ? n.lb.y1 : n.y]; }
      default:  return [n.x + n.w / 2 + f * n.w, n.y + n.h];
    }
  }
  const out = (p, side, d) => side === "r" ? [p[0] + d, p[1]] : side === "l" ? [p[0] - d, p[1]] : side === "t" ? [p[0], p[1] - d] : [p[0], p[1] + d];
  function route(s){
    const a = byId[s.f], b = byId[s.to], [ps, pe] = s.p || ["r", "l"];
    let start = port(a, ps, s.fo || 0), end = port(b, pe, s.too || 0);
    // straight line instead of a small jog when the two symbols overlap (no hand routing given)
    if (!s.via && s.mx == null && s.my == null && s.fo == null && s.too == null){
      const H = ["r", "l"].includes(ps) && ["r", "l"].includes(pe), V = ["t", "b"].includes(ps) && ["t", "b"].includes(pe);
      if (H && start[1] !== end[1]){ const lo = Math.max(a.y, b.y) + 8, hi = Math.min(a.y + a.h, b.y + b.h) - 8;
        if (hi >= lo){ const y = Math.min(hi, Math.max(lo, (start[1] + end[1]) / 2)); start = [start[0], y]; end = [end[0], y]; } }
      if (V && start[0] !== end[0]){ const lo = Math.max(a.x, b.x) + 8, hi = Math.min(a.x + a.w, b.x + b.w) - 8;
        if (hi >= lo){ const x = Math.min(hi, Math.max(lo, (start[0] + end[0]) / 2)); start = [x, start[1]]; end = [x, end[1]];
          if (ps === "t" && a.lb && x > a.lb.x1 && x < a.lb.x2) start[1] = a.lb.y1; if (pe === "t" && b.lb && x > b.lb.x1 && x < b.lb.x2) end[1] = b.lb.y1; } }
    }
    const exit = out(start, ps, 22), appr = out(end, pe, 22);
    let mids = s.via ? s.via.slice() : [];
    if (!s.via && s.ar) mids = autoRoute(exit, appr, ps, pe) || [];

      hit.go(); if (location.hash === "#layout"){ const nid = nd && byId[nd] ? nd : Object.keys(EQUIP_DATA).find(id => EQUIP_DATA[id].eq.some(r => Lookup.norm(r.tag) === k) || EQUIP_DATA[id].ins.some(i => Lookup.norm(i.tag) === k));
        setView("map"); if (nid) setTimeout(() => PFDLayout.focus(nid), 700); } }); }, 300); }

  window.addEventListener("keydown", e => { if (e.key === "Escape"){ closeInfo(); if (focusFlow) setFlow(null); clearSel(); if (window.fxClearWbs) fxClearWbs(); if (window.pfdBlocks && pfdBlocks.isOpen()){ pfdBlocks.close(); fitAnim(); } } });

  let tt; function toast(m){ const t = $("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(tt); tt = setTimeout(() => t.style.display = "none", 4200); }

  // ---------- label layout: equipment names and flow boxes placed where nothing else is ----------
  function flowText(s, ci){
    const D = STREAM_DATA[s.id]; if (!D) return null;
    const { C, calc } = streamCalc(D), n = (v, d) => v.toLocaleString("en-AU", { maximumFractionDigits: d }), ap = c => c ? "≈" : "";
    const sol = C.sol[ci];
    if (sol != null && sol > 0) return `${ap(calc.sol[ci])}${n(sol, sol < 10 ? 1 : 0)} tph`;
    // water only lines: tonnes of water (m³/h × SG where only a volume is given)
    const wat = C.wat[ci] != null ? C.wat[ci] : (C.vol[ci] != null && ["water", "cnw"].includes(s.ty) ? C.vol[ci] * (C.sgl[ci] || 1) : null);
    if (wat != null && wat >= 1) return `${C.wat[ci] != null ? ap(calc.wat[ci]) : "≈"}${n(wat, 0)} tph`;
    return null;
  }
  function setBox(s, txt){ const f = s.fb; f.t.textContent = txt; const w = f.t.getComputedTextLength() + 14;
    f.r.setAttribute("x", f.cx - w / 2); f.r.setAttribute("width", w); }
  function layoutLabels(){
    const SEG = [];
    STREAMS.forEach(s => { for (let i = 0; i < s.pts.length - 1; i++){ const [a, b] = [s.pts[i], s.pts[i + 1]]; SEG.push({ s, x1: Math.min(a[0], b[0]), x2: Math.max(a[0], b[0]), y1: Math.min(a[1], b[1]), y2: Math.max(a[1], b[1]) }); } });
    const lineIn = (r, skip) => { let t = 0; for (const g of SEG){ if (g.s === skip) continue;
      const w = Math.min(g.x2, r.x2) - Math.max(g.x1, r.x1), h = Math.min(g.y2, r.y2) - Math.max(g.y1, r.y1);
      if (w >= 0 && h >= 0) t += Math.max(w, h, 1); } return t; };
    const ov = (a, b) => Math.max(0, Math.min(a.x2, b.x2) - Math.max(a.x1, b.x1)) * Math.max(0, Math.min(a.y2, b.y2) - Math.max(a.y1, b.y1));
    const bodies = NODES.map(n => ({ n, x1: n.x - 3, y1: n.y - (["tank", "cell"].includes(n.t) ? 16 : 3), x2: n.x + n.w + 3, y2: n.y + n.h + 3 }));
    const placed = [];
    const cost = (r, own, skipS) => { let c = lineIn({ x1: r.x1 - 4, y1: r.y1 - 4, x2: r.x2 + 4, y2: r.y2 + 4 }, skipS) * 10;
      bodies.forEach(b => { if (b.n !== own) c += ov(r, b) * (own ? 0.6 : 4); }); placed.forEach(p => c += ov(r, p) * 8); return c; };
    const inFrame = r => FRAMES.some(f => (r.x1 + r.x2) / 2 > f.x && (r.x1 + r.x2) / 2 < f.x + f.w && (r.y1 + r.y2) / 2 > f.y && (r.y1 + r.y2) / 2 < f.y + f.h);
    // node name boxes are fixed above each symbol; they are obstacles for everything else
    NODES.forEach(n => placed.push(n.lb));
    // area titles: top left, top right, bottom left or bottom right, wherever no line runs through the text
    FRAMES.forEach(f => {
      let fs = 17; f.t.style.fontSize = fs + "px"; let bb = f.t.getBBox();
      while (bb.width > f.w - 30 && fs > 11){ fs--; f.t.style.fontSize = fs + "px"; bb = f.t.getBBox(); }
      const w = bb.width, h = bb.height, C = [];
      [0, 0.5, 1].forEach((k, i) => { const x = f.x + 14 + (f.w - 28 - w) * k; C.push([x, f.y + 8, i * 2], [x, f.y + f.h - 8 - h, 3 + i * 2]); });
      let best = null;
      C.forEach(([x, y, pen]) => { const r = { x1: x - 4, y1: y - 2, x2: x + w + 4, y2: y + h + 2 };
        let c = lineIn(r) * 10 + pen; NODES.forEach(n => { c += ov(r, n.lb) * 4 + ov(r, { x1: n.x, y1: n.y, x2: n.x + n.w, y2: n.y + n.h }) * 4; });
        if (!best || c < best.c) best = { r, c, x, y }; });
      const base = +f.t.getAttribute("y") - bb.y; f.t.setAttribute("x", best.x); f.t.setAttribute("y", best.y + base);
      f.hr = best.r; f.hcost = best.c; placed.push(best.r);
    });
    // flow boxes: every line with PDC data, on a long straight run away from arrow heads and clutter
    const order = STREAMS.filter(s => flowText(s, 0)).map(s => ({ s, L: s.pts.reduce((t, p, i) => i ? t + Math.abs(p[0] - s.pts[i - 1][0]) + Math.abs(p[1] - s.pts[i - 1][1]) : 0, 0) })).sort((a, b) => a.L - b.L);
    order.forEach(({ s }) => {
      // box lives above the equipment layer and mirrors its line's visibility, fading and highlight
      const g = el("g", { class: "lab fbx" }, gFlow), t = el("text", { x: 0, y: 0, "text-anchor": "middle" }, g), txt = flowText(s, 0);
      t.textContent = txt; const bw = t.getComputedTextLength() + 16, bh = 21, need = bw + 2 * 22;   // the line must stay visible either side of the box
      let best = null;
      for (let i = 0; i < s.pts.length - 1; i++){
        const a = s.pts[i], b = s.pts[i + 1], hz = a[1] === b[1], L = Math.abs(b[0] - a[0]) + Math.abs(b[1] - a[1]), half = bw / 2 + 24, vw = hz ? bw : bh, vh = hz ? bh : bw;   // boxes turn to run along vertical lines
        [0.5, 0.35, 0.65, 0.22, 0.78].forEach(f => {
          const cx = a[0] + (b[0] - a[0]) * f, cy = a[1] + (b[1] - a[1]) * f, dEnd = Math.min(f, 1 - f) * L;
          const r = { x1: cx - vw / 2, y1: cy - vh / 2, x2: cx + vw / 2, y2: cy + vh / 2 };
          const c = cost(r, null, s) + (dEnd < half ? 400 + (half - dEnd) * 5 : 0) + (L < need ? 5000 : 0) - Math.min(L, 700) * 0.04 + Math.abs(f - 0.5) * 12 + (hz ? 0 : 3);
          if (!best || c < best.c) best = { c, cx, cy, r, hz, L };
        });
      }
      placed.push(best.r);
      s.fb = { g, t, cx: best.cx, t0: txt };
      t.setAttribute("x", best.cx); t.setAttribute("y", best.cy + 4);
      s.fb.short = best.L < need; s.fb.cost = best.c;
      s.fb.r = el("rect", { x: best.cx - bw / 2, y: best.cy - bh / 2, width: bw, height: bh, rx: 5, style: `stroke:${STREAM_TYPES[s.ty].color}` }); g.insertBefore(s.fb.r, t); if (inFrame(best.r)) g.classList.add("inf");
      if (!best.hz) g.setAttribute("transform", `rotate(-90 ${best.cx} ${best.cy})`);
      s.fb.tip = el("title", {}, g); s.fb.tip.textContent = s.n + ": " + txt;
      const sync = () => { ["hl", "ghost", "svc", "sel"].forEach(c => g.classList.toggle(c, s.g.classList.contains(c))); g.style.display = s.g.style.display; };
      new MutationObserver(sync).observe(s.g, { attributes: true, attributeFilter: ["class", "style"] }); sync();
      g.addEventListener("click", e => { if (moved) return; e.stopPropagation(); pick(e, { k: "s", id: s.id }, () => showStream(s)); });
    });
  }
  layoutLabels();
  // Layout self check (used when editing coordinates): window.pfdCheck() lists clashes
  window.pfdCheck = () => {
    const ov = (a, b) => Math.max(0, Math.min(a.x2, b.x2) - Math.max(a.x1, b.x1)) * Math.max(0, Math.min(a.y2, b.y2) - Math.max(a.y1, b.y1));
    const body = n => ({ x1: n.x, y1: n.y - ({ tank: 14, cell: 8 }[n.t] || 0), x2: n.x + n.w, y2: n.y + n.h });
    const out = { short: STREAMS.filter(s => s.fb && s.fb.short).map(s => s.id + ":" + s.f + ">" + s.to), labelHits: [], headers: FRAMES.filter(f => f.hcost > 20).map(f => f.label + " cost " + Math.round(f.hcost)), jogs: [], boxHits: [] };
    NODES.forEach(n => { NODES.forEach(m => { if (m !== n && (ov(n.lb, body(m)) > 30 || (m.id > n.id && ov(n.lb, m.lb) > 30))) out.labelHits.push(n.id + "/" + m.id); });
      FRAMES.forEach(f => { if (ov(n.lb, f.hr) > 20) out.labelHits.push(n.id + "/header " + f.label.slice(0, 12)); }); });
    STREAMS.forEach(s => { for (let i = 1; i < s.pts.length - 2; i++){ const L = Math.abs(s.pts[i + 1][0] - s.pts[i][0]) + Math.abs(s.pts[i + 1][1] - s.pts[i][1]); if (L > 0 && L < 18) out.jogs.push(s.id + " " + L); } });
    STREAMS.forEach(s => { if (s.fb && s.fb.cost > 200) out.boxHits.push(s.id + " " + Math.round(s.fb.cost)); });
    // where extra space is needed: [axis, position, amount] (used by tools/relayout.js)
    out.needs = [];
    STREAMS.forEach(s => { if (!s.fb || !s.fb.short) return; let bi = 0, bl = 0;
      for (let i = 0; i < s.pts.length - 1; i++){ const L = Math.abs(s.pts[i + 1][0] - s.pts[i][0]) + Math.abs(s.pts[i + 1][1] - s.pts[i][1]); if (L > bl){ bl = L; bi = i; } }
      const a = s.pts[bi], b = s.pts[bi + 1], need = s.fb.r.getBBox().width + 50;
      if (a[1] === b[1]) out.needs.push(["x", (a[0] + b[0]) / 2, need - bl]); else out.needs.push(["y", (a[1] + b[1]) / 2, need - bl]); });
    const rects = NODES.map(n => [n, body(n)]).concat(NODES.map(n => [n, n.lb]));
    for (let i = 0; i < rects.length; i++) for (let j = i + 1; j < rects.length; j++){ const [n, A] = rects[i], [m, B] = rects[j]; if (n === m) continue;
      const w = Math.min(A.x2, B.x2) - Math.max(A.x1, B.x1), h = Math.min(A.y2, B.y2) - Math.max(A.y1, B.y1); if (w <= 2 || h <= 2) continue;
      const ca = [(A.x1 + A.x2) / 2, (A.y1 + A.y2) / 2], cb = [(B.x1 + B.x2) / 2, (B.y1 + B.y2) / 2];
      if (Math.abs(ca[0] - cb[0]) > Math.abs(ca[1] - cb[1])) out.needs.push(["x", (ca[0] + cb[0]) / 2, w + 16]); else out.needs.push(["y", (ca[1] + cb[1]) / 2, h + 16]); }
    return out;
  };
  applyStage(); startView();
})();
